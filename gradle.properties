group = com.github.sangharshgautam.logtime

pluginRepositoryUrl = https://github.com/sangharshgautam/logtime

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Configuration cache is disabled because the version is derived from git tags at
# configuration time (grgit/git external processes are not config-cache compatible).
org.gradle.configuration-cache = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
